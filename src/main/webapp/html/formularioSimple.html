<html lang="es">
    <head>
        <title>Formulario Simple</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" type="text/css" href="../css/style.css">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    </head>
    <body>

        <h1>Formulario Simple</h1><br>
        <div class="formulario">
            <form action="../FormularioSimple" method="post">
                <label for="nb">Nombre</label><br>
                <input type="text" name="nombre" id="nb" placeholder="Ej. Juan" required><br>
                <label for="dt">Fecha de nacimiento</label><br>
                <input type="date" name="fechaNacimiento" id="dt" required><br>
                <label for="sal">Salario</label><br>
                <input type="number" name="salario" step="0.01" id="sal" required><br>
                <label for="hj">N&uacute;mero de hijos</label><br>
                <input type="number" name="hijos" id="hj" required><br>
                <label>Preferencias</label><br>
                <label><input type="checkbox" name= "preferencias" value="Leer">Leer</label>
                <label><input type="checkbox" name= "preferencias" value="Nadar">Nadar</label>
                <label><input type="checkbox" name= "preferencias" value="Dormir">Dormir</label>
                <label><input type="checkbox" name= "preferencias" value="Bailar">Bailar</label><br>
                <br>
                <input class="botonEnviar" type="submit">
            </form>
        </div>
        <br>
        <a class="enlace" href="../index.html">Volver</a>
    </body>
</html>
