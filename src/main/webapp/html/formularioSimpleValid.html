<html lang="es">
    <head>
        <title>Formulario Simple con Validaciones</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" type="text/css" href="../css/style.css">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    </head>
    <body>

        <h1>Formulario Simple con Validaciones</h1><br>
        <div class="formulario">
            <form action="../FormularioSimpleValid" method="post">
                <table>
                    <tr>
                        <td><label for="nb">Nombre</label></td>
                        <td><input type="text" name="Nombre" id="nb" placeholder="Ej. Juan"></td>
                    </tr>
                    <tr>
                        <td><label for="dt">Fecha de nacimiento</label></td>
                        <td><input type="date" name="Fecha_de_nacimiento" id="dt"></td>
                    </tr>
                    <tr>
                        <td><label for="sal">Salario</label></td>
                        <td><input type="number" name="Salario" step="0.01" id="sal"></td>
                    </tr>
                    <tr>
                        <td><label for="hj">N&uacute;mero de hijos</label></td>
                        <td><input type="number" name="Hijos" id="hj"></td>
                    </tr>
                    <tr>
                        <td><label for="preferencias">Preferencias</label></td>
                        <td><select name="Preferencias" id="preferencias" multiple>
                            <option value="Leer">Leer</option>
                            <option value="Nadar">Nadar</option>
                            <option value="Dormir">Dormir</option>
                            <option value="Bailar">Bailar</option>
                        </select></td>
                    </tr>
                </table>
                <br>
                <input class="botonEnviar" type="submit">
                <input type="button" class="botonVolver" name="volver" value="Volver al inicio" onclick="window.location.href='../index.html'">
            </form>
        </div>        
    </body>
</html>
